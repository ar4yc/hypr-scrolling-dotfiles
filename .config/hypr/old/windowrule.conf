windowrule {
   name = dolphin
   match:class = org.kde.dolphin
   match:title = .*/.*
   min_size = 1060 548
}

windowrule {
   name = dolphin-Properties
   match:class = org.kde.dolphin
   match:initial_title = .*Properties.*|.*Choose Application.*
   float = on
   center = on
}

windowrule {
   name = copymove-dolphin
   match:class = org.kde.dolphin
   match:title = .*(Cop|Mov|Progress).*
   float = on
}

windowrule {
   name = create-dolphin
   match:class = org.kde.dolphin
   match:title = .*(File Already Exists|Progress Dialog|Creating directory).*
   float = on
   center = on
   size = window_w window_h
}

windowrule {
   name = steam
   match:class = steam
   match:initial_title = Steam
   tile = on
   min_size = 1099 898
}

windowrule {
   name = steam-dropwindow
   match:class = steam
   match:title = negative:Steam|()
   float = on
   center = on
   size = 920 571
}

windowrule {
   name = steam-updater
   match:class = 
   match:title = Steam
   float = on
   center = on
   size = window_w window_h
}

windowrule {
   name = steam-context-menu
   match:class = steam
   match:initial_title = ^$
   float = on
   min_size = window_w window_h
   stay_focused = on
}

windowrule {
   name = steam-settings
   match:class = steam
   match:title = .*(Настройки|Settings).*
   float = on
   center = on
   size = 840 717
}

windowrule {
   name = steam-friends
   match:class = steam
   match:title = .*(Список друзей|Friends List).*
   float = on
   center = on
   size = 925 591
}

windowrule {
   name = steam-notification
   match:class = steam
   match:initial_title = .*notif.*
   float = on
   center = off
   no_focus = on
   no_blur = on
}

windowrule {
   name = steam-other
   match:class = steam
   match:initial_title = .*(Завершение работы|Shutdown|Войти|Sign|Запуск...|Launch...|О Steam|About steam|окно|Dialog).*
   float = on
   center = on
   size = window_w window_h
}

windowrule {
   name = steam-add-games
   match:class = steam
   match:initial_title = .*(Добавить стороннюю игру|Add Non-Steam Game).*
   float = on
   center = on
   size = 900 790
}

windowrule {
   name = steam-games
   match:class = .*steam_app.*
   float = on
   center = on
   no_blur = on
   opaque = on
}

windowrule {
   name = peazip
   match:class = peazip
   match:title = (?i).*(Extract|info).*
   float = on
   center = on
   size = window_w*0.9 window_w*0.9
}

windowrule {
   name = flameshot
   match:class = flameshot
   float = on
   size = monitor_w monitor_h
   move = 0 0
   opaque = on
   rounding = 0
   border_size = 0
   no_blur = on
   no_anim = on
}

windowrule {
   name = flameshot-settings
   match:class = flameshot
   match:initial_title = (?i).*(Настройки|Settings).*
   float = on
   size = window_w window_h
   center = on
   no_blur = off
   no_anim = off
   stay_focused = off
   pin = off
   border_size = 2
   rounding = 6
   opaque = on
}

windowrule {
   name = flameshot-save
   match:class = flameshot
   match:title = (?i).*(Сохранить|Save).*
   float = on
   center = on
   size = 1044 761
   no_blur = off
   no_anim = off
   stay_focused = off
   pin = off
   border_size = 2
   rounding = 6
   opaque = on
}

windowrule {
   name = qBittorrent_all
   match:class = org.qbittorrent.qBittorrent
   float = on
   center = on
}

windowrule {
   name = qBittorrent
   match:class = org.qbittorrent.qBittorrent
   match:title = .*qBittorrent v.*
   tile = on
}

windowrule {
   name = offtile-class
   match:class = (?i).*(file_progress|confirm|dialog|download|notification|error|splash|org.kde.kdialog|wizard|assistant|auth|permission).*
   float = on
   center = on
}

windowrule {
   name = offtile-title
   match:title = (?i).*(Open Files|Save File|Choose Files|Please choose a file).*
   float = on
   center = on
   size = window_w window_h
   persistent_size = on
}

# VMware
submap = passthrough
bind = SUPER, F, fullscreen, 0
bind = SUPER, F, submap, reset
submap = reset