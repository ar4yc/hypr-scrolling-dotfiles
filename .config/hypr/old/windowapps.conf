# ▄▀█ █▀█ █▀█ █▔▔
# █▀█ █▀▀ █▀▀ ▂▂█

layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.4, match:namespace waybar
layerrule = blur on, match:namespace swaync-control-center
layerrule = ignore_alpha 0.4, match:namespace swaync-control-center
layerrule = blur on, match:namespace wofi
layerrule = ignore_alpha 0.4, match:namespace wofi

# Volume Control
windowrule {
   name = pavucontrol
   match:class = pavucontrol-qt
   float = on
   size = 659 410
   move = ((monitor_w-668)-10) monitor_h*0+35
   pin = on
}

# Bluetooth manager
windowrule {
   name = Overskride
   match:class = blueman-manager
   float = on
   center = on
   size = 920 685
   pin = on
}

# Wifi menu
windowrule {
   name = nm-applet
   match:class = nm-connection-editor
   float = on
   size = 398 388
   move = ((monitor_w-398)-100) monitor_h*0+35
   pin = on
}

windowrule {
   name = waytrogen
   match:title = .*Waytrogen.*
   float = on
   center = on
   size = 1295 928
}

windowrule {
   name = mpv
   match:class = mpv
   float = on
   center = on
   no_blur = on
   opaque = on
   keep_aspect_ratio = on
}

windowrule {
   name = mpv_audio
   match:class = mpv_only_audio_mpv
   float = on
   center = on
   opacity = 0.75
}

windowrule {
   name = qView
   match:class = com.interversehq.qView
   float = on
   center = on
   size = monitor_w*0.5 monitor_h*0.6
   min_size = 200 200
   max_size = monitor_w*0.9 monitor_h*0.9
   opaque = on
}

windowrule {
   name = Dialect
   match:class = app.drey.Dialect
   float = on
   center = on
   size = 814 320
}

windowrule {
   name = Waydroid
   match:class = Waydroid
   opaque = on
}

windowrule {
   name = MissionCenter
   match:class = io.missioncenter.MissionCenter
   float = on
   center = on
   size = 1045 553
}

windowrule {
   name = youtube_music
   match:class = com.github.th_ch.youtube_music
   opacity = 0.883
   min_size = 424 704
}

#Zen History
windowrule {
   name = zen-history
   match:class = zen|firefox
   match:title = .*(Библиотека|Library).*
   float = on
   center = on
   opaque = on
   size = monitor_w*0.4 monitor_h*0.8
}

# Picture-in-Picture
windowrule {
   name = PiP
   match:title = (?i).*(Картинка в картинке|Картинка-в-картинке|Picture in Picture|Picture-in-Picture|PiP).*
   float = on
   size = 587 330
   pin = on
   opaque = on
   keep_aspect_ratio = on
   border_size = 0
   rounding = 17
}

windowrule {
   name = discord-pip
   match:class = vesktop|discord
   match:initial_title = Discord Popout
   float = on
   max_size = 519 290
   min_size = 519 290
   move = monitor_w*0.001 monitor_h*0.25
   pin = on
   opaque = on
   no_blur = on
   no_initial_focus = on
   rounding = 17
}

windowrule {
   name = telegram-call
   match:class = telegram|io.github.tdesktop_x64.TDesktop
   match:title = negative:.*64Gram.*
   match:initial_title = negative:.*64Gram.*
   float = on
   center = on
   size = monitor_w*0.35 monitor_h*0.53
}

windowrule {
   name = telegram-media
   match:class = telegram|io.github.tdesktop_x64.TDesktop
   match:initial_title = .*(Просмотр медиа|Media).*
   float = on
   center = on
   size = monitor_w*0.85 monitor_h*0.85
}

windowrule {
   name = vmware
   match:class = Vmware
   opaque = on
   no_blur = on
}

windowrule {
   name = portal
   match:class = 1
   float = on
   center = on
   size = monitor_w*0.45 monitor_h*0.8
}

windowrule {
   name = hyprland-share
   match:class = hyprland-share-picker
   float = on
   center = on
   size = window_w window_h
   persistent_size = on
   pin = on
}

windowrule {
   name = gsr ui
   match:title = (gsr ui|gsr notify)
   float = on
   move = monitor_w*0 monitor_h*0
   size = monitor_w monitor_h
   opaque = on
   rounding = 0
   no_blur = on
   border_size = 0
   pin = on
}

windowrule {
   name = kdenlive
   match:class = org.kde.kdenlive
   match:title = .* Kdenlive.*
   tile = on
   size = window_w window_h
   max_size = 2548 1040
   rounding = 3
   border_size = 0
   opaque = on
}

windowrule {
   name = kdenlive-settings
   match:class = org.kde.kdenlive
   match:title = .*Configure.*
   float = on
   center = on
   size = 1274 816
   opaque = on
}

windowrule {
   name = kdenlive-splash
   match:class = org.kde.kdenlive
   match:title = .*Splash Screen.*
   float = on
   center = on
   size = window_w window_h
   opaque = on
}

windowrule {
   name = PrismLauncher_download
   match:class = org.prismlauncher.PrismLauncher
   match:title = (?i).*(Загрузить|Download).*
   float = on
   center = on
   size = 1037 734
}

windowrule {
   name = PrismLauncher_console
   match:class = org\.prismlauncher\.PrismLauncher
   match:title = (?i).*(консоли|Console).*
   float = on
   center = on
   size = 1224 912
}